<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Eras Escape</title>
  <!-- Tipografías por era (Google Fonts; si no cargan, se usa Georgia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&family=IM+Fell+English:ital@0;1&family=Josefin+Sans:wght@300;500&family=Old+Standard+TT:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <!-- Las URLs versionadas mantienen los módulos del juego sincronizados con la página. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "./js/forest-materials.js": "./js/forest-materials.js?v=6",
      "./js/forest-transition.js": "./js/forest-transition.js?v=5",
      "./js/interaction.js": "./js/interaction.js?v=3",
      "./js/intro.js": "./js/intro.js?v=3",
      "./js/introsound.js": "./js/introsound.js?v=3",
      "./js/light-budget.js": "./js/light-budget.js?v=6",
      "./js/lighting.js": "./js/lighting.js?v=3",
      "./js/main.js": "./js/main.js?v=4",
      "./js/museum-materials.js": "./js/museum-materials.js?v=3",
      "./js/player.js": "./js/player.js?v=3",
      "./js/puzzles.js": "./js/puzzles.js?v=3",
      "./js/roomforest.js": "./js/roomforest.js?v=6",
      "./js/roomlover.js": "./js/roomlover.js?v=3",
      "./js/roommidnights.js": "./js/roommidnights.js?v=3",
      "./js/roomreputation.js": "./js/roomreputation.js?v=3",
      "./js/rooms.js": "./js/rooms.js?v=3",
      "./js/secrets.js": "./js/secrets.js?v=3",
      "./js/songclips.js": "./js/songclips.js?v=3",
      "./js/songshelf.js": "./js/songshelf.js?v=3",
      "./js/streaming.js": "./js/streaming.js?v=3",
      "./js/surface-library.js": "./js/surface-library.js?v=3",
      "./js/trophies.js": "./js/trophies.js?v=3",
      "./js/visibility.js": "./js/visibility.js?v=3",
      "./js/volume.js": "./js/volume.js?v=3"
    }
  }
  </script>
</head>
<body class="is-loading">
  <!-- Visible desde el HTML, incluso mientras se descargan los módulos del juego. -->
  <div id="loading-screen" aria-labelledby="loading-title" aria-busy="true">
    <div class="loading-card">
      <div class="loading-emblem" aria-hidden="true"><span>✦</span></div>
      <p class="loading-eyebrow">CADA RECUERDO TIENE UNA HISTORIA</p>
      <h1 id="loading-title">The Eras <em>Escape</em></h1>
      <div class="loading-divider" aria-hidden="true"><i></i> ✦ <i></i></div>
      <p id="loading-status" role="status" aria-live="polite">Preparando tu historia…</p>
      <div class="loading-track" aria-hidden="true"><span></span></div>
      <p id="loading-detail">El museo está por abrir sus puertas.</p>
      <button id="loading-retry" type="button" hidden>VOLVER A INTENTAR</button>
      <noscript>Activá JavaScript y recargá la página para entrar al museo.</noscript>
    </div>
    <p class="loading-footer" aria-hidden="true">SEIS ERAS <span>✦</span> UNA SALIDA</p>
  </div>
  <canvas id="game"></canvas>

  <!-- HUD: interfaz sobre el canvas -->
  <div id="hud" class="hidden">
    <div id="room-name"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="held" class="hidden"></div>
    <div id="toast"></div>
    <div id="inventory">
      <h3>Objetos encontrados: <span id="count">0</span> / 6</h3>
      <ul id="inv-list"></ul>
    </div>
  </div>

  <!-- Pantalla inicial / pausa -->
  <div id="overlay" inert>
    <!-- Las capas se insertan desde js/hub.js (assets/ui/hub). El título, el subtítulo y las teclas son imágenes: aquí va el texto accesible. -->
    <h1 class="sr-only">The Eras Escape</h1>
    <div id="hub-stage">
      <button id="start-btn"><span class="lbl">COMENZAR LA HISTORIA</span><span class="chev" aria-hidden="true">›</span></button>
      <div id="hub-progress"><i></i><b aria-hidden="true">✦</b><span><span id="hub-count">0</span> / 6 recuerdos</span><i></i></div>
      <button id="hub-sound" class="hub-toggle" type="button" aria-label="Silenciar sonido"></button>
      <button id="hub-music" class="hub-toggle" type="button" aria-label="Silenciar música"></button>
    </div>
  </div>

  <script type="module" src="js/boot.js?v=3"></script>
</body>
</html>
