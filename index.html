<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Eras Escape</title>
  <!-- Tipografías por era (Google Fonts; si no cargan, se usa Georgia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&family=IM+Fell+English:ital@0;1&family=Josefin+Sans:wght@300;500&family=Old+Standard+TT:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Import map: permite escribir "import ... from 'three'" en los módulos -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- HUD: interfaz sobre el canvas -->
  <div id="hud" class="hidden">
    <div id="room-name"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="held" class="hidden"></div>
    <div id="toast"></div>
    <div id="inventory">
      <h3>Objetos encontrados: <span id="count">0</span> / 6</h3>
      <ul id="inv-list"></ul>
    </div>
  </div>

  <!-- Pantalla inicial / pausa -->
  <div id="overlay">
    <!-- Las capas se insertan desde js/hub.js (assets/ui/hub). El título, el subtítulo y las teclas son imágenes: aquí va el texto accesible. -->
    <h1 class="sr-only">The Eras Escape</h1>
    <div id="hub-stage">
      <button id="start-btn"><span class="lbl">COMENZAR LA HISTORIA</span><span class="chev" aria-hidden="true">›</span></button>
      <div id="hub-progress"><i></i><b aria-hidden="true">✦</b><span><span id="hub-count">0</span> / 6 recuerdos</span><i></i></div>
      <button id="hub-sound" class="hub-toggle" type="button" aria-label="Silenciar sonido"></button>
      <button id="hub-music" class="hub-toggle" type="button" aria-label="Silenciar música"></button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
